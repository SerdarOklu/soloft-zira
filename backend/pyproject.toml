[project]
name = "zira-backend"
version = "0.1.0"
description = "Zira backend: API, calculation engine and background jobs."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "geoalchemy2>=0.16",
    "celery[redis]>=5.4",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "pydantic>=2.9",
    "httpx>=0.27",
    "rasterio>=1.5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "db: needs PostgreSQL with PostGIS (TEST_DATABASE_URL)",
    "queue: needs Redis (REDIS_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
