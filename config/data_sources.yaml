# NASA data sources. Resolutions are approximate and must be confirmed per product
# version; regional data is never presented as a direct measurement of one field.
#
# priority: first | high | medium | optional  (order in which sources are connected)

sources:
  power:
    name: NASA POWER
    role: Daily climate inputs and long-term meteorology and radiation history
    access: power_daily_api
    resolution: varies by parameter; roughly 50 km
    priority: first
    scale_warning: >-
      Each parameter keeps its source product's native resolution. Store the API
      metadata instead of assuming one value.
  landsat8:
    name: Landsat 8
    role: 10-year vegetation pattern inside the field polygon
    # Read from the NASA and USGS Collection 2 Level-2 cloud-optimised GeoTIFFs of the public
    # Microsoft Planetary Computer STAC catalogue (no Earth Engine project needed).
    access: stac_cog
    collection_id: landsat-c2-l2
    resolution: 30 m
    priority: first
    scale_warning: >-
      Few pixels and mixed edges on small parcels. Cloud mask and polygon-interior
      statistics are mandatory.
  landsat9:
    name: Landsat 9
    role: 10-year vegetation pattern inside the field polygon
    access: stac_cog
    collection_id: landsat-c2-l2
    resolution: 30 m
    priority: first
    scale_warning: Same as Landsat 8. Launched in September 2021, so it adds scenes from 2022.
  gpm:
    name: GPM IMERG
    role: Rainfall estimate; regional cross-check of the POWER rainfall
    # NASA GES DISC, read with an Earthdata token: the daily 0.1 degree product. The Final run
    # (GPM_3IMERGDF) ends in September 2025; after that the Late run (GPM_3IMERGDL) is used.
    access: earthdata
    collection_id: GPM_3IMERGDF
    resolution: 0.1 degree, about 10 km; daily
    priority: high
    scale_warning: >-
      Fields in the same pixel are not separate rain observations. It is a cross-check of the POWER
      rainfall, never added to it.
  smap:
    name: SMAP
    role: Regional surface soil moisture; a cross-check of the model
    # NASA NSIDC, read with an Earthdata token: SPL3SMP_E, the enhanced 9 km daily product.
    access: earthdata
    collection_id: SPL3SMP_E
    resolution: about 9 km; daily, morning and evening
    priority: high
    scale_warning: >-
      Surface moisture of the top 5 cm on a 9 km cell. It is never shown as the moisture of the
      root zone or of one field.
  modis:
    name: MODIS
    role: Vegetation index (NDVI) time series for Field Memory; support for cloudy Landsat periods
    # Not read through Earth Engine: the NASA MOD13Q1 and MYD13Q1 version 061 cloud-optimised
    # GeoTIFFs of the public Microsoft Planetary Computer STAC catalogue, no account needed.
    access: stac_cog
    collection_id: modis-13Q1-061
    resolution: 250 m, 16-day composite (Terra and Aqua together, about every 8 days)
    priority: medium
    scale_warning: >-
      One pixel is about 6 ha, so a small parcel gives a mixed signal. Does not replace Landsat
      on small fields, and cannot tell crop species.
  grace:
    name: GRACE / GRACE-FO
    role: Basin-scale total water storage trend
    # NASA PO.DAAC, read with an Earthdata token: the JPL mascon solution, 0.5 degree grid.
    access: earthdata
    collection_id: TELLUS_GRAC-GRFO_MASCON_CRI_GRID_RL06.3_V4
    resolution: about 300 km; monthly
    priority: medium
    scale_warning: >-
      Total water storage over a wide area, never the groundwater under a parcel. There is a gap of
      about a year between GRACE and GRACE-FO.
  ecostress:
    name: ECOSTRESS
    role: Evapotranspiration support
    access: earth_engine
    collection_id: null   # to be selected
    resolution: 70 m
    priority: optional
    scale_warning: Not needed for the first working demo.
  srtm:
    name: SRTM
    role: Elevation and slope of the field
    # NASADEM, NASA's reprocessing of the SRTM data, from the open Planetary Computer catalogue.
    access: stac_cog
    collection_id: nasadem
    resolution: 30 m
    priority: optional
    scale_warning: >-
      A single acquisition from February 2000 (a surface model, so trees and buildings show);
      slope on a small field rests on few pixels.
