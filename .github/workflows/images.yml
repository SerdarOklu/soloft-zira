name: Images

# Build the backend and frontend images and push them to the GitHub Container Registry.
# The VPS pulls these images; it never builds them (docs/decisions/0006-vps-resource-budget.md).
# Pull requests are tested by ci.yml and do not push images.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/serdaroklu/zira-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          # Build context is the repository root: the backend image includes config/.
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    name: Frontend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Access to the private design system
        env:
          UDS_READ_TOKEN: ${{ secrets.UDS_READ_TOKEN }}
        run: |
          if [ -z "$UDS_READ_TOKEN" ]; then
            echo "::error::The UDS_READ_TOKEN secret is not set. The frontend image needs read access to the private SerdarOklu/soloft-uds repository; see frontend/README.md."
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/serdaroklu/zira-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Passed to the Dockerfile as a BuildKit secret; never written into a layer.
          secrets: |
            uds_token=${{ secrets.UDS_READ_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
