name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and configuration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test (also validates config/)
        run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Type check
        run: npm run typecheck

  compose:
    name: Compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate development Compose file
        run: docker compose --env-file .env.example -f infra/docker-compose.dev.yml config --quiet
      - name: Start database and queue
        run: |
          docker compose --env-file .env.example -f infra/docker-compose.dev.yml up -d --wait
          docker compose --env-file .env.example -f infra/docker-compose.dev.yml exec -T postgres \
            psql -U zira -d zira -c "SELECT postgis_version();"
          docker compose --env-file .env.example -f infra/docker-compose.dev.yml exec -T redis redis-cli ping
