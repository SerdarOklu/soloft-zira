# Main Nginx configuration for Zira. The server blocks live in templates/zira.conf.template,
# which the official image renders into /etc/nginx/conf.d/ with ${ZIRA_DOMAIN} substituted.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    gzip  on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Rate limit for sign-in attempts (docs/decisions/0008-sign-in-and-sessions.md,
    # phase 2 at Nginx). Keyed by client address; the burst absorbs a few quick retries.
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_status 429;

    # Standard reverse-proxy headers, reused by both upstreams.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Only our own server blocks. The image also ships a default.conf (a welcome page for
    # "localhost") that would answer the container's health check with a 404.
    include /etc/nginx/conf.d/zira.conf;
}
